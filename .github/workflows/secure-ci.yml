name: NOERITH secure CI

on:
  workflow_call:

jobs:
  verify:
    name: Lint, build, and test contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository verification
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x ./ci/verify.sh ]]; then
            echo "::error::Each repository using NOERITH secure CI must provide an executable ci/verify.sh."
            exit 1
          fi
          ./ci/verify.sh

# Contract for ci/verify.sh:
# 1. Run format and lint checks.
# 2. Build the deliverable.
# 3. Run the relevant unit/integration tests.
# The script must fail on any unsuccessful check.
